<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #172033;
      background: #f3f5f9;
    }
    main {
      width: min(100%, 420px);
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgb(20 30 55 / 10%);
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #5b6475; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd1dc;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 2px solid #5468ff; outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #4055e8;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #3044cf; }
    #message { margin: 16px 0 0; }
    #message.success { color: #14733c; }
    #message.error { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Enter your details to register.</p>

    <form id="registration-form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>

      <button type="submit">Register</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#registration-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "";

      const password = form.elements.password.value;
      const confirmPassword = form.elements.confirmPassword.value;
      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.classList.add("error");
        form.elements.confirmPassword.focus();
        return;
      }

      const name = form.elements.name.value.trim();
      message.textContent = `Thanks, ${name}! The form is valid. Connect it to a server to create an account.`;
      message.classList.add("success");
      form.reset();
    });
  </script>
</body>
</html>
