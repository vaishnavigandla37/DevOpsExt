<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an Account</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --panel: #ffffff;
      --primary: #4055e8;
      --primary-dark: #3044cf;
      --text: #172033;
      --muted: #5b6475;
      --border: #cbd1dc;
      --success: #14733c;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(100%, 420px);
      padding: 32px;
      background: var(--panel);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(20, 30, 55, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: var(--muted);
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: 2px solid rgba(84, 104, 255, 0.35);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--primary-dark);
    }

    #message {
      margin: 16px 0 0;
      min-height: 24px;
    }

    #message.success {
      color: var(--success);
    }

    #message.error {
      color: var(--error);
    }
  </style>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Enter your details to register.</p>

    <form id="registration-form" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required />

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />

      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required />

      <button type="submit">Register</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("registration-form");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      message.className = "";

      const name = form.elements.name.value.trim();
      const password = form.elements.password.value;
      const confirmPassword = form.elements.confirmPassword.value;

      if (!name) {
        message.textContent = "Please enter your full name.";
        message.classList.add("error");
        form.elements.name.focus();
        return;
      }

      if (password.length < 8) {
        message.textContent = "Password must be at least 8 characters long.";
        message.classList.add("error");
        form.elements.password.focus();
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.classList.add("error");
        form.elements.confirmPassword.focus();
        return;
      }

      message.textContent = `Thanks, ${name}! Your account details look valid. Connect it to a server to create an account.`;
      message.classList.add("success");
      form.reset();
    });
  </script>
</body>
</html>
